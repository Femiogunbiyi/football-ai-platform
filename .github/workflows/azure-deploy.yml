name: Deploy AI Football Platform to Azure

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }} 

    - name: Azure Container Registry Login
      run: |
        docker login ${{ secrets.AZR_REGISTRY_URL }} \
          -u ${{ secrets.AZR_REGISTRY_USERNAME }} \
          -p ${{ secrets.AZR_REGISTRY_PASSWORD }}

    - name: Build and Package Docker Image
      run: |
        docker build -t ${{ secrets.AZR_REGISTRY_URL }}/football-tracker-api:${{ github.sha }} .
        docker push ${{ secrets.AZR_REGISTRY_URL }}/football-tracker-api:${{ github.sha }}

    - name: Deploy to Azure Container Apps
      uses: azure/container-apps-deploy-action@v1
      with:
        acrName: ${{ secrets.ACR_NAME }}
        containerAppName: football-tracker-live-api
        resourceGroup: AI-Sports-Platform-RG
        imageToDeploy: ${{ secrets.AZR_REGISTRY_URL }}/football-tracker-api:${{ github.sha }}
